name: CI & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest paramiko requests

      - name: Run unit test suite
        run: |
          pytest tests/ -v

  build-exe:
    name: Build Standalone Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller paramiko requests

      - name: Compile Standalone EXE
        run: |
          cd windows
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "EntryNav2_Manager" --add-data "entrynav2;entrynav2" entrynav2_tool.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EntryNav2_Manager_Windows
          path: windows/dist/EntryNav2_Manager.exe
